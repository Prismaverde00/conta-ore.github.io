<title>Foma ij cont de Alex Speedypizza</title>
<style>
:root{
  --tov-a:#f0c3b6; --tov-b:#fbf3e2; --box:#fff8ea; --ink:#3b1d12; --muted:#7a5645;
  --crust:#e0a248; --basil:#2f7d3b; --cheese:#f6c648; --line:#e8d3a8; --field:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tov-a:#4a2a22; --tov-b:#2a1a14; --box:#3a241b; --ink:#fbeedb; --muted:#d3b79c;
    --crust:#c98a35; --basil:#7fcf8a; --cheese:#f6c648; --line:#5a3a2a; --field:#2a1a14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tov-a:#4a2a22; --tov-b:#2a1a14; --box:#3a241b; --ink:#fbeedb; --muted:#d3b79c;
  --crust:#c98a35; --basil:#7fcf8a; --cheese:#f6c648; --line:#5a3a2a; --field:#2a1a14; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:
    conic-gradient(var(--tov-a) 25%, var(--tov-b) 0 50%, var(--tov-a) 0 75%, var(--tov-b) 0) 0 0/56px 56px;
  padding:20px 14px 40px;
}
main{max-width:460px;margin:0 auto}
h1{
  font-family:Georgia,"Palatino Linotype",serif; font-weight:400; font-style:italic;
  font-size:clamp(1.7rem,8vw,2.3rem); line-height:1.05; text-align:center; margin:6px 0 18px;
  color:var(--ink); background:var(--box); border:4px solid var(--crust); border-radius:26px;
  padding:14px 12px 16px; box-shadow:0 6px 0 rgba(0,0,0,.25);
}
h1 .pz{display:block;font-size:2.4rem;margin-bottom:4px;animation:spin 1.4s ease-out 1}
h1 .de{font-style:normal;font-weight:400;font-size:.75em}
h1 .al{font-style:normal;font-weight:900}
@keyframes spin{from{transform:rotate(-360deg) scale(.3)}to{transform:none}}
@media (prefers-reduced-motion:reduce){h1 .pz{animation:none}}
.box{
  background:var(--box); border:4px solid var(--crust); border-radius:26px;
  padding:18px 16px; box-shadow:0 8px 0 rgba(0,0,0,.25); margin-bottom:16px;
}
h2{font-family:Georgia,serif;font-size:1.15rem;margin:0 0 12px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:4px}
input{
  width:100%; font:inherit; font-size:1.1rem; padding:11px 10px; color:var(--ink);
  background:var(--field); border:2px solid var(--line); border-radius:14px;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--basil);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.row small{color:var(--muted);display:block;font-size:.78rem}
.row b{font-size:1.4rem;white-space:nowrap}
.total{
  text-align:center; border-radius:26px; padding:22px 14px 20px; border:4px solid var(--crust);
  background:#8f2415; color:#fff; box-shadow:0 8px 0 rgba(0,0,0,.25);
}
.total p{margin:0;font-family:Georgia,serif;font-weight:900;font-style:italic;font-size:1.3rem}
.total strong{display:block;font-size:clamp(2.4rem,13vw,3.4rem);margin-top:6px;background:#fff8ea;color:#3b1d12;border-radius:16px;padding:2px 10px;display:inline-block}
.note{font-size:.85rem;color:var(--ink);background:var(--box);border-radius:16px;padding:10px 12px;text-align:center;margin:14px 0 0}
button{
  margin-top:12px; font:inherit; font-weight:700; color:#fff; background:var(--basil);
  border:0; border-radius:14px; padding:10px 16px; cursor:pointer;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#12301a}}
</style>
</head>

    <div class="grid">
      <div><label for="k1">Km iniziali</label><input id="k1" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      <div><label for="k2">Km finali</label><input id="k2" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
    </div>
    <div class="row"><div><b style="font-size:1rem">COMPENSO CHILOMETRICO</b><small id="hk">–</small></div><b id="pk">0,00 €</b></div>
  </section>

  <section class="total" aria-live="polite">
    <p>Daj, damme ij sòld</p>
    <strong id="tot">0,00 €</strong>
  </section>

  <p class="note">6,50 € all’ora (a scatti di mezz’ora) + 0,10 € al km.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const eur = n => n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const mins = v => { if(!v) return null; const [h,m] = v.split(":").map(Number); return h*60+m; };

function calc(){
  // Lavoro: differenza oraria, scatti da mezz'ora (arrotondata alla mezz'ora più vicina)
  const a = mins($("t1").value), b = mins($("t2").value);
  let work = 0, halves = 0;
  if(a !== null && b !== null){
    let d = b - a; if(d < 0) d += 1440;
    halves = Math.round(d / 30);
    work = halves * 0.5 * 6.5;
  }
  const h = Math.floor(halves/2), half = halves % 2 ? " e mezza" : "";
  $("hl").textContent = halves ? h + " ore" + half + " × 6,50 €" : "Inserisci inizio e fine";
  $("pl").textContent = eur(work);

  // Km: sempre positivi, anche se i valori sono invertiti
  const km = Math.abs(num($("k2").value) - num($("k1").value));
  const kmTxt = km.toLocaleString("it-IT",{maximumFractionDigits:2});
  $("hk").textContent = km ? kmTxt + " km × 0,10 €" : "Inserisci i chilometri";
  $("pk").textContent = eur(km * 0.10);

  $("tot").textContent = eur(work + km * 0.10);
}
["t1","t2","k1","k2"].forEach(id => $(id).addEventListener("input", calc));
calc();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
